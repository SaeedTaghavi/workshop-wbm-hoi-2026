<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download workshop slides — WBM &amp; HOI 2026</title>
<style>
body{font:16px/1.5 system-ui,-apple-system,sans-serif;color:#203046;background:#f8fafc;max-width:780px;margin:40px auto;padding:0 24px}
h1{font-size:1.8rem;line-height:1.25}button{font:inherit;cursor:pointer;border:1px solid #d0d7de;border-radius:8px;padding:11px 16px;background:white;color:#172536;text-align:left}button:hover{background:#e9f0fc}
button:disabled{opacity:.5;cursor:wait}ul{padding-left:0;list-style:none;display:grid;gap:10px}
li button{display:block;width:100%}#status{min-height:1.6em}a{color:#1959ad}
</style>
</head>
<body>
<p><a href="../">Workshop home</a> · <a href="./">GitHub materials directory</a></p>
<h1>Download workshop slides</h1>
<p>Select a speaker. The PDF is reassembled in your browser from files hosted in this GitHub repository. No Python or Google Drive access is needed.</p>
<ul id="downloads"></ul>
<p id="status" role="status" aria-live="polite"></p>
<script>
const slides={
rodrigo:{name:"Rodrigo Cofré",folder:"Rodrigo_Cofre",file:"RCofre_Whole_Brain_Models.pdf",parts:3},
yonatan:{name:"Yonatan Sanz Perl",folder:"Yonatan_Sanz_Perl",file:"YSanz_Physics_of_Cognition.pdf",parts:4},
xiaoge:{name:"Xiaoge Bao",folder:"Xiaoge_Bao",file:"Xiaoge_Pre.pdf",parts:2}
};
const list=document.querySelector("#downloads");
const status=document.querySelector("#status");
async function download(key,button){
const data=slides[key];if(!data)return;
button.disabled=true;status.textContent="Downloading "+data.name+"'s slides...";
try{
const chunks=[];
for(let i=1;i<=data.parts;i++){
const filename=data.file+".part"+String(i).padStart(3,"0");
const response=await fetch(data.folder+"/"+filename);
if(!response.ok)throw Error("Cannot fetch "+filename+" (HTTP "+response.status+")");
chunks.push(await response.arrayBuffer());
status.textContent="Loading "+data.name+" ("+i+"/"+data.parts+" parts)...";
}
const blob=new Blob(chunks,{type:"application/pdf"});
const url=URL.createObjectURL(blob);
const link=document.createElement("a");
link.href=url;link.download=data.file;
document.body.appendChild(link);link.click();link.remove();
setTimeout(()=>URL.revokeObjectURL(url),30000);
status.textContent=data.name+": download started ("+(blob.size/1048576).toFixed(1)+" MiB).";
}catch(error){status.textContent="Download failed: "+error.message;}finally{button.disabled=false;}
}
for(const [key,data] of Object.entries(slides)){
const item=document.createElement("li");const button=document.createElement("button");
button.textContent="Download PDF — "+data.name;
button.addEventListener("click",()=>download(key,button));
item.appendChild(button);list.appendChild(item);
}
const selected=new URLSearchParams(location.search).get("doc");
if(slides[selected])status.textContent="Ready to download "+slides[selected].name+"'s slides.";
</script>
</body>
</html>
